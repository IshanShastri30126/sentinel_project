# CTF Wars — Local Infrastructure
# Points to the SAME PostgreSQL + Redis that Sentinel uses.
# If Sentinel's docker-compose is already running, you do NOT need to start this.
# This file exists only as a reference for the connection credentials.

version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: ctfwars_shared_db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: cyberkavach
      POSTGRES_PASSWORD: cyberkavach_secret
      POSTGRES_DB: cyberkavach
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ctfwars_shared_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  pgdata:
