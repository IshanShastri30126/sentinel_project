services:
  postgres:
    image: postgres:16-alpine
    container_name: sentinal_db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: sentinal
      POSTGRES_PASSWORD: sentinal_secret
      POSTGRES_DB: sentinal
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: sentinal_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  pgdata:

