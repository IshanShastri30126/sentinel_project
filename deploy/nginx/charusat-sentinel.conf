# ==============================================================================
# SENTINAL & CTF WARS — CHARUSAT UNIVERSITY PRODUCTION REVERSE PROXY
# TARGET DEPLOYMENT: /etc/nginx/sites-available/sentinel.charusat.ac.in
# ==============================================================================

# 1. Connection Upgrade Mapping for WebSockets (Main WS + CTF Socket.io)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 2. Rate Limiting Zones (Defense-in-depth before application rate limiters)
limit_req_zone $binary_remote_addr zone=charusat_api_limit:15m rate=60r/s;
limit_req_zone $binary_remote_addr zone=charusat_auth_limit:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=charusat_conn_limit:10m;

# 3. Upstream Service Definitions (Localhost / Campus Subnet)
upstream sentinel_backend_main {
    server 127.0.0.1:4000 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

upstream ctf_backend_engine {
    server 127.0.0.1:5001 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

upstream sentinel_frontend_client {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream ctf_frontend_client {
    server 127.0.0.1:3001 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# 4. HTTP -> HTTPS Strict Redirect
server {
    listen 80;
    listen [::]:80;
    server_name sentinel.charusat.ac.in ctf.charusat.ac.in;
    
    # Let's Encrypt / Institutional ACME challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 5. Primary Sentinel Server Block (Main Portal + API)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sentinel.charusat.ac.in;

    # TLS Certificates (Charusat Institutional CA / Let's Encrypt)
    ssl_certificate /etc/ssl/certs/sentinel_charusat_bundle.crt;
    ssl_certificate_key /etc/ssl/private/sentinel_charusat.key;
    
    # Hardened TLS Parameters
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers (OWASP Compliant)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Request Body & Timeout Limits
    client_max_body_size 15M;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 65;
    send_timeout 15s;

    # A. Static Asset Caching for Next.js
    location /_next/static/ {
        proxy_pass http://sentinel_frontend_client;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # B. Main API Gateway Routing
    location /api/ {
        limit_req zone=charusat_api_limit burst=30 nodelay;
        limit_conn charusat_conn_limit 50;

        proxy_pass http://sentinel_backend_main;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Disable response buffering for streaming and real-time updates
        proxy_buffering off;
    }

    # C. Main WebSocket Endpoint (/socket.io/ or native WS)
    location /socket.io/ {
        proxy_pass http://sentinel_backend_main;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # D. Frontend Next.js SSR Routing
    location / {
        proxy_pass http://sentinel_frontend_client;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}

# 6. Dedicated CTF Wars Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ctf.charusat.ac.in;

    ssl_certificate /etc/ssl/certs/sentinel_charusat_bundle.crt;
    ssl_certificate_key /etc/ssl/private/sentinel_charusat.key;

    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    client_max_body_size 5M;

    # A. CTF Real-Time WebSocket Namespace (/ctf and /socket.io)
    location /socket.io/ {
        proxy_pass http://ctf_backend_engine;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # B. CTF Engine API
    location /api/ {
        limit_req zone=charusat_api_limit burst=20 nodelay;

        proxy_pass http://ctf_backend_engine;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # C. CTF Frontend Client
    location / {
        proxy_pass http://ctf_frontend_client;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
