# ==========================================================
# SENTINAL — Production Kubernetes Deployment Manifests
# ==========================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinal-api
  namespace: sentinal
  labels:
    app: sentinal-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sentinal-api
  template:
    metadata:
      labels:
        app: sentinal-api
    spec:
      containers:
        - name: api
          image: sentinal/api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: sentinal-config
            - secretRef:
                name: sentinal-secrets
          resources:
            limits:
              cpu: "1000m"
              memory: "1024Mi"
            requests:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: sentinal-api-service
  namespace: sentinal
spec:
  selector:
    app: sentinal-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sentinal-api-hpa
  namespace: sentinal
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sentinal-api
  minReplicas: 3
  maxReplicas: 25
  metrics:
    - type: Resource
      resource:
        name: cpu
      target:
        type: Utilization
        averageUtilization: 70
    - type: Resource
      resource:
        name: memory
      target:
        type: Utilization
        averageUtilization: 80
---
# ==========================================================
# Worker Deployment (Consuming BullMQ Heavy Jobs)
# ==========================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinal-worker
  namespace: sentinal
  labels:
    app: sentinal-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sentinal-worker
  template:
    metadata:
      labels:
        app: sentinal-worker
    spec:
      containers:
        - name: worker
          image: sentinal/worker:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: sentinal-config
            - secretRef:
                name: sentinal-secrets
          resources:
            limits:
              cpu: "1500m"
              memory: "2048Mi"
            requests:
              cpu: "750m"
              memory: "1024Mi"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sentinal-worker-hpa
  namespace: sentinal
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sentinal-worker
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
      target:
        type: Utilization
        averageUtilization: 75
---
# ==========================================================
# Ingress Controller Routing (Envoy / NGINX)
# ==========================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sentinal-ingress
  namespace: sentinal
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "sentinal-api-service"
spec:
  rules:
    - host: api.sentinal.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sentinal-api-service
                port:
                  number: 80
  tls:
    - hosts:
        - api.sentinal.org
      secretName: sentinal-tls-certs
